<!doctype html>
<html lang="ro">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student Dashboard</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header>
      <h1>Student Dashboard</h1>
      <p>Mini aplicație pentru analiza rezultatelor elevilor.</p>
    </header>

    <main>
      <section class="controls">
        <button id="showStudents">Afișează elevii</button>
        <button id="showPassed">Doar promovați</button>
        <input
          type="text"
          id="searchInput"
          placeholder="Caută elev după nume"
        />
        <button id="searchStudent">Caută</button>
      </section>

      <section>
        <h2>Lista elevilor</h2>
        <div id="studentList"></div>
      </section>
      <section>
        <h2>Media clasei</h2>
        <div id="average"></div>
      </section>
    </main>

    <script src="js/app.js"></script>
  </body>
</html>
